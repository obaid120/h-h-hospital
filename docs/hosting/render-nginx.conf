user www-data;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Avoid logging private booking URLs, patient references, IPs or queries.
    log_format handh '$time_iso8601 $request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout handh;
    server_tokens off;
    sendfile on;
    server {
        listen 10000;
        server_name _;
        root /var/www/html/public;
        index index.php;
        charset utf-8;
        client_max_body_size 4m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location ^~ /storage/ { return 404; }
        location ~ /\.(?!well-known) { deny all; }
        location = /index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_hide_header X-Powered-By;
        }
        location ~ \.php(?:/|$) { return 404; }
    }
}
